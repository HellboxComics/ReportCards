<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="2000" viewBox="0 0 2000 2000"><g transform="rotate(-0.8 330 1420)"><text x="340" y="1403" font-family="Caveat" font-size="88" fill="#D3121C">Bought the high of the year. Twice.</text><text x="354" y="1498" font-family="Caveat" font-size="88" fill="#D3121C">Same coin. Same afternoon.</text><text x="1205.8" y="1498" font-family="Caveat" font-size="70" fill="#D3121C">— H.</text></g></svg>
