<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="2000" viewBox="0 0 2000 2000"><g transform="rotate(0 330 1420)"><text x="340" y="1403" font-family="Caveat" font-size="88" fill="#D3121C">One more rug and we call your mother.</text><text x="340" y="1498" font-family="Caveat" font-size="88" fill="#D3121C">She has asked us not to.</text><text x="1108.4" y="1498" font-family="Caveat" font-size="70" fill="#D3121C">— H.</text></g></svg>
