<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="2000" viewBox="0 0 2000 2000"><g transform="rotate(-0.5 330 1420)"><text x="340" y="1403" font-family="Caveat" font-size="86" fill="#D3121C">The only student who ever listened. I</text><text x="352" y="1498" font-family="Caveat" font-size="86" fill="#D3121C">framed this card. I do not frame things.</text><text x="1480" y="1538" font-family="Caveat" font-size="69" fill="#D3121C">— H.</text></g></svg>
