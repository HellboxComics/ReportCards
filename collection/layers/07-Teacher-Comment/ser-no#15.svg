<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="2000" viewBox="0 0 2000 2000"><g transform="rotate(0.1 330 1420)"><text x="340" y="1403" font-family="Caveat" font-size="88" fill="#D3121C">Calls me &#39;ser.&#39; I asked them to stop.</text><text x="349" y="1498" font-family="Caveat" font-size="88" fill="#D3121C">They said &#39;ser, no.&#39;</text><text x="928" y="1498" font-family="Caveat" font-size="70" fill="#D3121C">— H.</text></g></svg>
