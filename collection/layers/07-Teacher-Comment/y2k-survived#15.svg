<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="2000" viewBox="0 0 2000 2000"><g transform="rotate(-0.4 330 1420)"><text x="340" y="1403" font-family="Caveat" font-size="74" fill="#D3121C">Prepared for Y2K by buying a coin called $Y2K.</text><text x="353" y="1498" font-family="Caveat" font-size="74" fill="#D3121C">The computers survived. The coin did not.</text><text x="1407.1" y="1498" font-family="Caveat" font-size="59" fill="#D3121C">— H.</text></g></svg>
